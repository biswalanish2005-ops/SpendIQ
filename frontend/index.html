<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>SpendIQ — AI Financial Intelligence Platform</title>
    <meta name="description" content="Production-grade AI/ML financial intelligence platform: data, visualization, predictive forecasting, anomaly detection, and grounded AI insights." />

    <!-- PWA / browser chrome -->
    <meta name="theme-color" content="#0B0F14" />
    <meta name="color-scheme" content="dark" />

    <!-- Security headers (supplementary — main headers set by server) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Font performance: preconnect to Google Fonts CDN before any CSS requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <!-- DNS prefetch as fallback for older browsers -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  </head>
  <body class="bg-background text-textPrimary antialiased selection:bg-primary/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
