version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: spendiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendiq_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendiq_secure_db_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-spendiq_prod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendiq_admin} -d ${POSTGRES_DB:-spendiq_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - spendiq-network

  # ----------------------------------------------------------------------------
  # Redis Cache & Background Queue
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spendiq-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spendiq-network

  # ----------------------------------------------------------------------------
  # SpendIQ Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendiq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=${BACKEND_WORKERS:-2}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-spendiq_admin}:${POSTGRES_PASSWORD:-spendiq_secure_db_password_change_me}@db:5432/${POSTGRES_DB:-spendiq_prod}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-spendiq_production_secret_key_please_change_this_to_a_random_hex_token}
      - JWT_ALGORITHM=HS256
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SENTRY_DSN=${SENTRY_DSN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - spendiq-network

  # ----------------------------------------------------------------------------
  # SpendIQ Background Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendiq-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-spendiq_admin}:${POSTGRES_PASSWORD:-spendiq_secure_db_password_change_me}@db:5432/${POSTGRES_DB:-spendiq_prod}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-spendiq_production_secret_key_please_change_this_to_a_random_hex_token}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - spendiq-network

  # ----------------------------------------------------------------------------
  # SpendIQ Frontend Web App (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
    container_name: spendiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - spendiq-network

networks:
  spendiq-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
